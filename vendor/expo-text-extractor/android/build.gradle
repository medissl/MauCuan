plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}
group = 'expo.modules.textextractor'
version = '2.0.0'
android {
  namespace 'expo.modules.textextractor'
  defaultConfig {
    versionCode 1
    versionName '2.0.0'
  }
}
dependencies {
  implementation 'com.google.mlkit:text-recognition:16.0.1'
}
